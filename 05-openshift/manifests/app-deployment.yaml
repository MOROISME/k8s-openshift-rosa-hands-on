apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-web
  labels:
    app: sandbox-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-web
  template:
    metadata:
      labels:
        app: sandbox-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # OpenShift 制限付き SCC 向け（特権ポートを使わない）
          image: nginxinc/nginx-unprivileged:1.25-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
