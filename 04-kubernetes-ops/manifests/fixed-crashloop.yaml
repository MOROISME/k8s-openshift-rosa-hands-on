apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-crash
  labels:
    app: broken-crash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-crash
  template:
    metadata:
      labels:
        app: broken-crash
    spec:
      containers:
        - name: boom
          image: busybox:1.36
          command: ["sh", "-c", "echo ok: staying up; sleep 3600"]
