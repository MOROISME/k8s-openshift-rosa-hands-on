apiVersion: v1
kind: Namespace
metadata:
  name: ops-rbac
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-sa
  namespace: ops-rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: ops-rbac
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: ops-rbac
subjects:
  - kind: ServiceAccount
    name: readonly-sa
    namespace: ops-rbac
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
